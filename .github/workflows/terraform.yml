name: Terraform CI/CD

on:
  pull_request:
    paths:
      - '**.tf'
      - 'cloud-init.yaml'
      - 'terraform.tfvars'
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - 'cloud-init.yaml'
      - 'terraform.tfvars'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  TF_VAR_cloudflare_tunnel_token: ${{ secrets.TF_VAR_CLOUDFLARE_TUNNEL_TOKEN }}
  TF_VAR_ssh_allowed_ip: ${{ secrets.TF_VAR_SSH_ALLOWED_IP }}
  TF_VAR_admin_username: agent
  TF_VAR_location: eastus

jobs:
  validate:
    name: Validate & Fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      - name: Terraform Fmt
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Test (unit tests with mocking)
        id: test
        run: terraform test -no-color
        continue-on-error: true

      - name: Validate cloud-init syntax
        id: cloudinit
        run: python3 scripts/validate-cloudinit.py

      - name: Cloud-init integration tests
        id: cloudinit_tests
        run: python3 scripts/test-cloudinit.py

      - name: Fmt results
        if: steps.fmt.outcome == 'failure'
        run: echo "terraform fmt found issues. Run 'terraform fmt -recursive' locally."

  plan:
    name: Terraform Plan
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      # The SSH key is needed for azurerm_linux_virtual_machine.admin_ssh_key
      # Generate a throwaway key for CI. In production, use a real key stored
      # as a GitHub secret.
      - name: Generate CI SSH key
        run: |
          ssh-keygen -t rsa -b 4096 -f /tmp/ci_ssh_key -N "" -C "ci@github-actions"
          mkdir -p ~/.ssh
          cp /tmp/ci_ssh_key.pub ~/.ssh/id_rsa.pub
          cp /tmp/ci_ssh_key ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Run TFLint (Terraform linter)
        id: tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint Init
        run: tflint --init
        continue-on-error: true

      - name: TFLint Check
        run: tflint -f compact
        continue-on-error: true

      - name: Run Checkov (security scan)
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout || steps.plan.outputs.stderr }}
        with:
          script: |
            const output = `#### Terraform Plan 📖\n<details><summary>Show Plan</summary>\n\n\`\`\`\n${process.env.PLAN_OUTPUT}\n\`\`\`\n\n</details>\n\n*Pusher: @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Terraform Apply
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x

      # Use a stored SSH key for the VM (GitHub secret)
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/id_rsa
          chmod 644 ~/.ssh/id_rsa.pub

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve -input=false

      - name: Post Apply Summary
        run: |
          echo "## Terraform Apply Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**VM:** \`$(terraform output -raw vm_name)\`" >> $GITHUB_STEP_SUMMARY
          echo "**Private IP:** \`$(terraform output -raw vm_private_ip)\`" >> $GITHUB_STEP_SUMMARY
          echo "**SSH:** \`$(terraform output -raw ssh_command)\`" >> $GITHUB_STEP_SUMMARY
